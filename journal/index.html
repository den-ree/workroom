<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Journal: building products, creative coding, music, AI, and staying creative.">
    <link rel="canonical" href="https://denree.nl/journal">
    <meta property="og:title" content="Journal - Den Ree Workroom">
    <meta property="og:description" content="Journal: building products, creative coding, music, AI, and staying creative.">
    <meta property="og:url" content="https://denree.nl/journal">
    <meta property="og:type" content="website">
    <title>Journal - Den Ree Workroom</title>
    <link rel="stylesheet" href="/css/style.css?v=45">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="navbar">
            <div class="navbar-container">
                <a href="/" class="logo">@den_ree</a>

                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item"><a href="/music" class="nav-link">Music</a></li>
                    <li class="nav-item"><a href="/software" class="nav-link">Software</a></li>
                    <li class="nav-item"><a href="/about" class="nav-link">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <!-- Page Header -->
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Journal</h1>
                <p class="page-subtitle">notes about making music with livecoding, building apps, experimenting with AI.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">

                <!-- Active filter display — populated by JS when a tag is tapped -->
                <div class="journal-active-filter" id="journalActiveFilter"></div>

                <!-- Notes -->
                <ul class="log" id="journalGrid">

                    <li class="log-item" data-thread="livecoding" data-status="finished">
                        <p class="log-meta">6 Mar 2026 · Amsterdam</p>
                        <h3 class="log-title">
                            <a href="/journal/finding-algoraves">Finding Algoraves</a>
                        </h3>
                        <p class="log-tags">
                            <button type="button" class="log-tag badge badge--thread badge--livecoding">livecoding music</button> ·
                            <button type="button" class="log-tag">performance</button> ·
                            <button type="button" class="log-tag">algorave</button>
                        </p>
                    </li>

                    <li class="log-item" data-thread="ai" data-status="finished">
                        <p class="log-meta">28 Feb 2026 · Rotterdam</p>
                        <h3 class="log-title">
                            <a href="/journal/wearing-the-suit">Wearing the Suit</a>
                        </h3>
                        <p class="log-tags">
                            <button type="button" class="log-tag badge badge--thread badge--ai">working with AI</button> ·
                            <button type="button" class="log-tag">tools</button>
                        </p>
                    </li>

                    <li class="log-item" data-thread="ai" data-status="finished">
                        <p class="log-meta">11 Sep 2025 · Amsterdam</p>
                        <h3 class="log-title">
                            <a href="/journal/why-blanche">Why blanche?</a>
                        </h3>
                        <p class="log-tags">
                            <button type="button" class="log-tag badge badge--thread badge--ai">working with AI</button>
                        </p>
                    </li>

                </ul>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="site-footer"></footer>

    <script src="/js/main.js?v=46"></script>
    <script src="/js/background-code.js?v=4"></script>
    <script>
        const items = document.querySelectorAll('#journalGrid .log-item');
        const activeFilterEl = document.getElementById('journalActiveFilter');
        let activeTag = null;

        function applyFilter(tag) {
            items.forEach(item => {
                if (!tag) {
                    item.classList.remove('is-hidden');
                    return;
                }
                const match = Array.from(item.querySelectorAll('.log-tag'))
                    .some(t => t.textContent.trim() === tag);
                item.classList.toggle('is-hidden', !match);
            });
        }

        function showChip(label) {
            activeFilterEl.innerHTML =
                `<button type="button" class="log-active-filter" id="activeTagChip">${label} ×</button>`;
            document.getElementById('activeTagChip').addEventListener('click', clearFilter);
        }

        function clearFilter() {
            activeTag = null;
            activeFilterEl.innerHTML = '';
            applyFilter(null);
        }

        document.querySelectorAll('#journalGrid .log-tag').forEach(tagBtn => {
            tagBtn.addEventListener('click', e => {
                e.stopPropagation();
                const label = tagBtn.textContent.trim();

                if (activeTag === label) {
                    clearFilter();
                    return;
                }

                activeTag = label;
                showChip(label);
                applyFilter(label);
            });
        });
    </script>
</body>
</html>
