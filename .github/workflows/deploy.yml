name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r about software music journal css js images fonts assets _site/
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          [ -f CNAME ] && cp CNAME _site/ || true

      - name: Build calendar invites
        # One .ics per dated event for the homepage "+ Calendar" button (iOS Safari
        # only adds invites from a real .ics URL). See scripts/build-calendar.js.
        run: node scripts/build-calendar.js _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
