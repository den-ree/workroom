<body class="page-universe">
    <!-- Header -->
    <header class="header" id="header">
        <nav class="navbar">
            <div class="navbar-container">
                <a href="/" class="logo">@den_ree</a>

                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item"><a href="/music" class="nav-link">Music</a></li>

    <main>
        <!--
            Timeline universe: full-screen canvas, newest events on the left, scroll right
            to go back in time. Nodes are rendered by js/timeline.js from the data in
            js/timeline-data.js — to add an event, edit that data file (see
            .claude/skills/add-timeline-event/SKILL.md). Positions are automatic.
        -->
        <section id="timeline" class="universe" aria-label="Timeline of performances, releases, and notes">
            <div class="universe-title" id="universeTitle">
                <h1 class="hero-title">Exploring the creative<br>potentials of code</h1>
                <p class="hero-subtitle">Musician &middot; Livecoder &middot; A/V&nbsp;performer</p>
            </div>
            <div class="universe-strip" id="timelineStrip" tabindex="0">
                <div class="universe-canvas" id="tlCanvas">
                    <svg class="timeline-lines" id="tlSvg" aria-hidden="true"></svg>
                </div>
            </div>

            <span class="universe-hint" id="universeHint" aria-hidden="true"><span class="universe-hint__arrow">&gt;</span><span class="universe-hint__arrow">&gt;</span><span class="universe-hint__arrow">&gt;</span></span>
            <p class="universe-credit">Font: Karrik by Jean-Baptiste Morizot, Lucas Le Bihan by <a href="https://velvetyne.fr" target="_blank" rel="noopener noreferrer">velvetyne.fr</a>.</p>
        </section>
    </main>

    <!-- Footer (hidden on homepage via CSS; credit shown as universe-credit overlay) -->
